name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test + vet
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # typst/rust-toolchain.toml pins the channel.
      - name: Install Rust
        run: rustup show
        working-directory: typst

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: typst
          cache-on-failure: true

      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('go.mod') }}

      - name: Install golangci-lint and govulncheck
        run: |
          [ -x ~/go/bin/golangci-lint ] && [ -x ~/go/bin/govulncheck ] ||
            { go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest && go install golang.org/x/vuln/cmd/govulncheck@latest; }
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # The built library, keyed on the crate's sources: a Go-only change compiles no Rust,
      # and the Rust tests run only when the library had to be built.
      - name: Host triple
        id: host
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"

      # The release's macOS job restores this library, so it targets the app's minimum macOS.
      - name: Target the oldest supported macOS
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(jq -r .macos.minimumSystemVersion mygo.json)" >> "$GITHUB_ENV"

      # The built library, keyed on the crate's sources; the release's macOS job restores it too.
      - name: Restore the Typst library
        id: typst-lib
        uses: actions/cache@v4
        with:
          path: typst/target/*/release/libthesio_typst.a
          key: typst-lib-ci-${{ steps.host.outputs.triple }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('typst/**') }}

      - name: Rust tests, clippy and the library build
        if: steps.typst-lib.outputs.cache-hit != 'true'
        run: scripts/check.sh --rust-only

      - name: gofmt, vet, lint, tests, govulncheck
        run: scripts/check.sh --go-only

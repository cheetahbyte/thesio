name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One platform per row: mygo build takes one CC for all the targets of a run,
        # and the Rust library is built for each target's triple. typst-lib.yml repeats it.
        include:
          - { name: macOS, os: macos-latest, platform: darwin/universal, triples: "aarch64-apple-darwin x86_64-apple-darwin" }
          # Linux on 22.04: its glibc 2.35 and plain x86-64 baseline are the oldest the app
          # runs on. 26.04 links glibc 2.43 and marks the binary x86-64-v3, which the loader
          # refuses on CPUs and VMs without AVX2 ("CPU ISA level is lower than required").
          - { name: Linux x64, os: ubuntu-22.04, platform: linux/amd64, triples: x86_64-unknown-linux-gnu }
          - { name: Linux arm64, os: ubuntu-22.04-arm, platform: linux/arm64, triples: aarch64-unknown-linux-gnu }
          - { name: Windows, os: windows-latest, platform: windows/amd64, triples: x86_64-pc-windows-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Signing the macOS app needs these secrets, and in mygo.json macos.signingIdentity
      # and macos.notarize.keychainProfile "notary" (MyGo's docs/github-actions.md).
      # mygo.json cannot read NOTARY_KEYCHAIN, so notarytool has to find the profile
      # in the keychains this step lists.
      - name: Import the certificate and the notary credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Restored from what the Typst library workflow built on main; built only on a miss.
      - uses: ./.github/actions/typst-lib
        with:
          platform: ${{ matrix.platform }}
          triples: ${{ matrix.triples }}

      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}

      # Signing the Windows app needs these secrets, windows.certificate in mygo.json set to
      # the path this step writes (mygo.json cannot read WINDOWS_CERTIFICATE_FILE), and
      # MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # in the env of "Build and upload". On a Windows runner mygo build signs with signtool.
      # - name: Write the certificate
      #   if: runner.os == 'Windows'
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #   run: |
      #     echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/code-signing.pfx"
      #     echo "WINDOWS_CERTIFICATE_FILE=$RUNNER_TEMP/code-signing.pfx" >> "$GITHUB_ENV"

      # Built here, uploaded by the publish job: platforms uploading at the same time
      # overwrite each other's SHA256SUMS on the release.
      - name: Build
        env:
          CGO_ENABLED: "1"
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}"

      - name: Check the app runs on its minimum macOS
        if: runner.os == 'macOS'
        run: |
          tar -xzf build/darwin-universal/thesio-*-darwin-universal.tar.gz -C "$RUNNER_TEMP"
          scripts/check-macos-target.sh "$RUNNER_TEMP/Thesio.app"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ strategy.job-index }}
          path: build/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: builds
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One SHA256SUMS for every platform: the lines of each build's, by file name.
          cat builds/*/SHA256SUMS | awk '!seen[$2]++' | sort -k2 > SHA256SUMS
          # What mygo build -upload publishes: archives, disk images, installers,
          # packages, install scripts and update files, not the apps' own files. Each name
          # once: every Unix build has its install.sh, and gh fails on a repeated name.
          files=$(find builds -mindepth 3 -maxdepth 3 -type f \( -name '*.tar.gz' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*-setup-*.exe' -o -name '*.delta' -o -name 'update-*.json' \
            -o -name 'install.sh' -o -name 'install.ps1' \) | awk -F/ '!seen[$NF]++')
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $files SHA256SUMS
          echo "Uploaded to the draft release $GITHUB_REF_NAME; publish it when it looks right:"
          echo "  gh release edit $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY --draft=false"

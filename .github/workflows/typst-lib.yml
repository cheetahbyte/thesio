name: Typst library

# Builds the release's Typst libraries on main, where every tag's run can restore them:
# caches saved by a tag's run are invisible to the next tag. The schedule restores each
# one before GitHub evicts caches unused for 7 days.
on:
  push:
    branches: [main]
    paths:
      - typst/**
      - mygo.json
      - scripts/build-typst.sh
      - .github/actions/typst-lib/**
      - .github/workflows/typst-lib.yml
  schedule:
    - cron: "0 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The build matrix of release.yml: the same runners give the same cache keys.
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: darwin/universal, triples: "aarch64-apple-darwin x86_64-apple-darwin" }
          - { name: Linux x64, os: ubuntu-22.04, platform: linux/amd64, triples: x86_64-unknown-linux-gnu }
          - { name: Linux arm64, os: ubuntu-22.04-arm, platform: linux/arm64, triples: aarch64-unknown-linux-gnu }
          - { name: Windows, os: windows-latest, platform: windows/amd64, triples: x86_64-pc-windows-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/typst-lib
        with:
          platform: ${{ matrix.platform }}
          triples: ${{ matrix.triples }}
